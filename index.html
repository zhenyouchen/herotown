<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇者小镇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #game-container {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #game {
            flex: 1;
            background: #1a1a2e;
        }
        
        /* 顶部状态栏 */
        .top-bar {
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ffd700;
            flex-shrink: 0;
        }
        
        .top-bar h1 {
            font-size: 24px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .stats-container {
            display: flex;
            gap: 30px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }
        
        .stat-label {
            color: #aaa;
        }
        
        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }
        
        /* 底部面板 */
        .bottom-panel {
            height: 280px;
            background: linear-gradient(0deg, #2d2d44 0%, #1a1a2e 100%);
            border-top: 3px solid #ffd700;
            display: flex;
            flex-shrink: 0;
        }
        
        /* 标签页 */
        .tabs {
            width: 100px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
        }
        
        .tab-btn {
            padding: 15px 10px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        
        .tab-btn:hover {
            background: #2d2d44;
            color: #fff;
        }
        
        .tab-btn.active {
            background: #2d2d44;
            color: #ffd700;
            border-left-color: #ffd700;
        }
        
        /* 内容区域 */
        .tab-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: white;
        }
        
        .tab-content h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        /* 建筑卡片 */
        .building-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .building-card {
            background: #3a3a5a;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .building-card:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }
        
        .building-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .building-level {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }
        
        .building-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        
        .upgrade-btn {
            width: 100%;
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .upgrade-btn:hover {
            background: #45a049;
        }
        
        .upgrade-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        /* 勇者列表 */
        .hero-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .hero-card {
            background: #3a3a5a;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 15px;
        }
        
        .hero-avatar {
            width: 60px;
            height: 60px;
            background: #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .hero-info {
            flex: 1;
        }
        
        .hero-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .hero-stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #aaa;
        }
        
        .hero-power {
            font-size: 16px;
            color: #4CAF50;
            margin-top: 8px;
        }
        
        /* 事件弹窗 */
        .event-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .event-modal.show {
            display: flex;
        }
        
        .event-content {
            background: #2d2d44;
            border: 3px solid #ffd700;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            text-align: center;
        }
        
        .event-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        .skill-choices {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        
        .skill-choice {
            flex: 1;
            background: #3a3a5a;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skill-choice:hover {
            border-color: #ffd700;
            transform: translateY(-3px);
        }
        
        .skill-name {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        .skill-type {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .skill-desc {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <h1>🏰 勇者小镇</h1>
            <div class="stats-container">
                <div class="stat">
                    <span class="stat-label">💰 金钱:</span>
                    <span class="stat-value" id="money">500</span>
                </div>
                <div class="stat">
                    <span class="stat-label">📅 天数:</span>
                    <span class="stat-value" id="day">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">⏰ 时间:</span>
                    <span class="stat-value" id="time">8:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">👥 勇者:</span>
                    <span class="stat-value" id="hero-count">1</span>
                </div>
            </div>
        </div>
        
        <!-- Phaser 游戏区域 -->
        <div id="game"></div>
        
        <!-- 底部面板 -->
        <div class="bottom-panel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="buildings">🏗️ 建筑</button>
                <button class="tab-btn" data-tab="heroes">👥 勇者</button>
                <button class="tab-btn" data-tab="shop">🛒 商店</button>
            </div>
            <div class="tab-content" id="tab-content">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>
    
    <!-- 事件弹窗 -->
    <div class="event-modal" id="event-modal">
        <div class="event-content" id="event-content">
            <!-- 动态内容 -->
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="js/Hero.js"></script>
    <script src="js/Buildings.js"></script>
    <script src="js/GameManager.js"></script>
    <script src="js/UIManager.js"></script>
    <script src="js/scenes/MainScene.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
